[package]
name = "mcp-cura"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A structured Model Context Protocol server for CuraEngine slicing and STL mesh preparation"
license = "MIT"
repository = "https://github.com/martinsgmx/mcp-cura"
readme = "README.md"
keywords = ["mcp", "cura", "curaengine", "3d-printing", "stl"]
categories = ["api-bindings", "command-line-utilities"]
default-run = "mcp-cura"

[lib]
name = "mcp_cura"
path = "src/lib.rs"

[[bin]]
name = "mcp-cura"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
baby_shark = "0.3.12"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
hex = "0.4"
http = "1"
rust-ini = "0.21.3"
meval = "0.2"
nalgebra = "0.34"
quick-xml = "0.42"
rust-mcp-axum = { version = "1.0.2", default-features = false }
rust-mcp-sdk = { version = "1.1.0", default-features = false, features = [
    "server",
    "macros",
    "stdio",
    "streamable-http",
    "sse",
    "auth",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "fs",
    "io-util",
    "net",
    "sync",
    "process",
] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
which = "8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
